name: verify release

# The assets are the source of truth. This workflow re-hashes what was actually
# published and rewrites the manifests from those bytes, so they cannot drift from the
# files players download — even if a release is uploaded by hand, from a machine that has
# never seen this repository.
#
# Three kinds of release live here and they are verified separately:
#
#   v<version>          the launcher builds. SHA256SUMS and latest.json describe them.
#   preset-<version>    the curated preset the launcher installs. preset.json describes it.
#   engine-<version>    the PrismLauncher build the launcher downloads and runs. engine.json
#                       describes it, and it is the download a launcher executes, so the hash
#                       it publishes is the only thing standing between a player and
#                       arbitrary code.
#
# All three tracks except the launcher's are deliberately *not* the repository's latest
# release, so the `releases/latest/download/latest.json` URL keeps pointing at a launcher
# build — the manifest a future updater would read.
#
# A green run means the manifests in the repository match the release exactly.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (for example v0.9.0)
        required: true

permissions:
  contents: write

concurrency:
  group: verify-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event checks out the tag, which cannot be pushed to.
          ref: ${{ github.event.repository.default_branch }}

      - name: Download the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" --dir assets --clobber

      - name: Re-hash the launcher assets and refresh SHA256SUMS and latest.json
        if: ${{ !startsWith(env.TAG, 'preset-') && !startsWith(env.TAG, 'engine-') }}
        run: |
          python3 scripts/verify-release.py \
            --assets assets \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --write

      - name: Re-hash the preset and refresh preset.json
        if: ${{ startsWith(env.TAG, 'preset-') }}
        run: |
          python3 scripts/verify-preset.py \
            --assets assets \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --write

      - name: Re-hash the engine build and refresh engine.json
        if: ${{ startsWith(env.TAG, 'engine-') }}
        run: |
          python3 scripts/verify-engine.py \
            --assets assets \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --write

      - name: Commit the manifests if they changed
        run: |
          set -euo pipefail
          for manifest in SHA256SUMS latest.json preset.json engine.json; do
            if [ -f "$manifest" ]; then git add "$manifest"; fi
          done

          if git diff --cached --quiet; then
            echo "manifests already match $TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refresh manifests for $TAG"
          git push

      # The manifests are also attached to the release itself, which is what makes
      # `releases/latest/download/latest.json` a link that always resolves — the URL the
      # site and a future updater read. Doing it here rather than by hand is deliberate:
      # v0.9.2 was published without them and the link 404'd until it was noticed, and
      # v0.9.1 shipped with only one of the two.
      - name: Attach the refreshed manifests to the release
        if: ${{ !startsWith(env.TAG, 'preset-') && !startsWith(env.TAG, 'engine-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" latest.json SHA256SUMS --clobber

      # Same reason as above: engine.json is the manifest a launcher fetches, and
      # `releases/download/<tag>/engine.json` is the copy that is pinned to the build it
      # describes, so the manifest cannot later describe a different one.
      - name: Attach the refreshed manifest to the engine release
        if: ${{ startsWith(env.TAG, 'engine-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" engine.json --clobber
